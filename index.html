<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>YükRadar</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f4f7f8;
  color:#17212b
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#f7f9fa;
  padding-bottom:86px
}

.top{
  background:#0f766e;
  color:#fff;
  padding:22px 18px 18px;
  border-radius:0 0 24px 24px;
  box-shadow:0 5px 18px #0002
}

.brand{
  display:flex;
  align-items:center;
  justify-content:space-between
}

.logo{
  font-size:24px;
  font-weight:800
}

.bell{
  background:#ffffff22;
  border:1px solid #ffffff33;
  border-radius:12px;
  padding:9px;
  font-size:20px
}

.small{
  font-size:13px;
  opacity:.82;
  margin-top:3px
}

.location{
  margin-top:18px;
  background:#ffffff18;
  border:1px solid #ffffff30;
  border-radius:14px;
  padding:12px 13px;
  display:flex;
  justify-content:space-between;
  align-items:center
}

.location select{
  flex:1;
  margin-left:10px;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:15px;
  font-weight:700
}

.location select option{
  color:#17212b;
  background:#fff
}

.content{
  padding:18px
}

.card{
  background:#fff;
  border:1px solid #e1e7eb;
  border-radius:18px;
  padding:16px;
  box-shadow:0 3px 12px #1222;
  margin-bottom:15px
}

h2{
  font-size:19px;
  margin:2px 0 13px
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}

.field label{
  font-size:12px;
  color:#687681;
  display:block;
  margin:0 0 6px
}

.field select,
.field input{
  width:100%;
  padding:13px 11px;
  border:1px solid #d5dde2;
  border-radius:12px;
  background:#fff;
  font-size:15px;
  color:#17212b
}

.full{
  grid-column:1/-1
}

.cta{
  width:100%;
  border:0;
  background:#0f766e;
  color:#fff;
  padding:15px;
  border-radius:13px;
  font-size:17px;
  font-weight:750;
  margin-top:13px
}

.ai{
  background:linear-gradient(135deg,#ecfdf5,#eff6ff);
  border:1px solid #cfe9df
}

.ai textarea{
  width:100%;
  min-height:70px;
  border:1px solid #d5dde2;
  border-radius:12px;
  padding:12px;
  font:inherit;
  resize:none
}

.ai button{
  margin-top:9px;
  border:0;
  border-radius:11px;
  background:#17212b;
  color:#fff;
  padding:10px 14px;
  font-weight:650
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 2px 10px
}

.section-title h2{
  margin:0
}

.filter{
  font-size:13px;
  color:#0f766e;
  font-weight:700
}

.load{
  background:#fff;
  border:1px solid #e0e7eb;
  border-radius:17px;
  padding:15px;
  margin-bottom:11px
}

.route{
  font-size:18px;
  font-weight:800
}

.arrow{
  color:#0f766e
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin:9px 0
}

.pill{
  font-size:12px;
  background:#eef3f5;
  padding:6px 8px;
  border-radius:9px;
  color:#52616c
}

.price{
  font-size:18px;
  font-weight:800
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:520px;
  margin:auto;
  background:#fff;
  border-top:1px solid #dde4e8;
  display:flex;
  justify-content:space-around;
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
  z-index:5
}

.nav{
  font-size:11px;
  color:#65737d;
  text-align:center
}

.nav b{
  display:block;
  font-size:20px;
  line-height:23px
}

.nav.active{
  color:#0f766e;
  font-weight:750
}

.note{
  font-size:11px;
  color:#7b8790;
  text-align:center;
  margin-top:5px
}

.toast{
  position:fixed;
  left:50%;
  bottom:88px;
  transform:translateX(-50%);
  background:#17212b;
  color:white;
  padding:10px 14px;
  border-radius:12px;
  font-size:13px;
  display:none;
  z-index:10
}

@media(min-width:600px){
  body{
    padding:20px 0
  }

  .app{
    border-radius:24px;
    overflow:hidden;
    box-shadow:0 10px 40px #0002
  }
}
</style>
</head>

<body>

<div class="app">

    </div>

  </div>

  <div class="location">
    <span>📍</span>

    <select id="citySelect">

      <option>Adana</option>
      <option>Adıyaman</option>
      <option>Afyonkarahisar</option>
      <option>Ağrı</option>

      <option>Aydın</option>
      <option>Balıkesir</option>

      <option>Kastamonu</option>

    </select>

</header>


<main class="content">

<section class="card">

<h2>Yük ara</h2>

<div class="grid">

 <div class="field">
  <label>Araç tipi</label>

  <select id="vehicle">
    <option>13.60 Tır</option>
    <option>Kısa Dorse</option>
    <option>Kamyon (10 Teker - 40 Ayak)</option>

  </select>
 </div>


 <div class="field">
  <label>Yükleme tarihi</label>
  <input type="date" id="date">
 </div>


 <div class="field full">
  <label>Gideceğin yön</label>
  <input id="destination" placeholder="Örn. İstanbul, Ankara, Bursa">
 </div>

</div>


<button class="cta" onclick="findLoads()">
🔎 Uygun Yükleri Bul
</button>

<div class="note">
Şimdilik örnek veriler gösterilmektedir.
</div>

</section>


<section class="card ai">

<h2>🤖 YükRadar Asistanı</h2>

<div style="font-size:13px;color:#596873;margin-bottom:9px">
Normal cümleyle yaz, uygun yükleri filtreleyelim.
</div>

<textarea placeholder="Örn: Konya'dan İstanbul'a yarın çıkacağım, 13.60 tır..."></textarea>

<button onclick="showToast('YükRadar Asistanı prototipte hazır 👍')">
Asistana Sor
</button>

<h2>Sana Uygun Yükler</h2>

</div>

  <b>▣</b>Yükler
 </div>

 <div class="nav">
  <b>🚛</b>Seferler
 </div>

 <div class="nav">
  <b>🔔</b>Bildirim
 </div>

 <div class="nav">
  <b>●</b>Profil
 </div>

</nav>


<div id="toast" class="toast"></div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://inqemiglfelvepxgjlod.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_cqK2O5-DBEPzhqOmC4yFVg_WIQDBGys";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const d = document.getElementById("date");

d.value = new Date()
  .toISOString()
  .slice(0,10);


let allLoads = [];


function getValue(row, names, fallback="") {

  for (const name of names) {

    if (
      row[name] !== undefined &&
      row[name] !== null &&
      row[name] !== ""
    ) {
      return row[name];
    }

  }

  return fallback;
}


function formatDate(value) {

  if (!value) return "-";

  const date = new Date(value);

  if (isNaN(date)) return value;

  return date.toLocaleDateString("tr-TR", {
    day:"numeric",
    month:"long"
  });
}


function renderLoads(loads) {

  const box = document.getElementById("loads");

  box.innerHTML = "";


  if (!loads || loads.length === 0) {

    box.innerHTML = `
      <div class="load">
        <div class="route">
          Uygun yük bulunamadı
        </div>

        <div class="note">
          Filtreleri değiştirip tekrar deneyebilirsin.
        </div>
      </div>
    `;

    return;
  }


  loads.forEach(row => {

    const origin = getValue(
      row,
      ["origin","from","nereden","yukleme_yeri","cikis_yeri"],
      "Konya"
    );


    const destination = getValue(
      row,
      ["destination","to","nereye","varis_yeri"],
      "-"
    );


    const vehicle = getValue(
      row,
      ["vehicle_type","vehicle","arac_tipi"],
      "Belirtilmemiş"
    );


    const tonnage = getValue(
      row,
      ["tonnage","weight","ton","agirlik"],
      ""
    );


    const loadingDate = getValue(
      row,
      ["loading_date","load_date","date","yukleme_tarihi"],
      ""
    );


    const price = getValue(
      row,
      ["price","freight","ucret","fiyat"],
      ""
    );


    const description = getValue(
      row,
      ["description","aciklama","details"],
      ""
    );


    const phone = getValue(
      row,
      ["phone","telefon","contact"],
      ""
    );


    const card = document.createElement("div");

    card.className = "load";


    card.innerHTML = `

      <div class="route">
        ${origin}
        <span class="arrow">→</span>
        ${destination}
      </div>


      <div class="meta">

        ${
          tonnage
            ? `<span class="pill">${tonnage} ton</span>`
            : ""
        }

        <span class="pill">
          ${vehicle}
        </span>

        ${
          loadingDate
            ? `<span class="pill">${formatDate(loadingDate)}</span>`
            : ""
        }

      </div>


      ${
        price
          ? `<div class="price">${price} TL</div>`
          : ""
      }


      ${
        description
          ? `
            <div
              class="note"
              style="text-align:left;margin-top:8px">
              ${description}
            </div>
          `
          : ""
      }


      ${
        phone
          ? `
            <button
              onclick="window.location.href='tel:${phone}'"
              style="
                margin-top:10px;
                border:0;
                border-radius:10px;
                background:#0f766e;
                color:white;
                padding:10px 14px;
                font-weight:700">
              📞 İletişime Geç
            </button>
          `
          : ""
      }

    `;


    box.appendChild(card);

  });

}


async function loadLoads() {

  const box =
    document.getElementById("loads");


  box.innerHTML = `
    <div class="load">
      <div class="route">
        Yükler yükleniyor...
      </div>
    </div>
  `;


  const { data, error } =
    await supabaseClient
      .from("yukler")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if (error) {

    console.error(error);

    box.innerHTML = `
      <div class="load">

        <div class="route">
          Yükler alınamadı
        </div>

        <div
          class="note"
          style="text-align:left">
          Supabase bağlantısını kontrol et.
        </div>

      </div>
    `;

    return;
  }


  allLoads = data || [];

  renderLoads(allLoads);

}


function findLoads() {

  const dest =
    document
      .getElementById("destination")
      .value
      .trim()
      .toLowerCase();


  const vehicle =
    document
      .getElementById("vehicle")
      .value
      .toLowerCase();


  const date =
    document
      .getElementById("date")
      .value;


  const city =
    document
      .getElementById("citySelect")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allLoads.filter(row => {


      const rowDest =
        String(
          getValue(
            row,
            [
              "destination",
              "to",
              "nereye",
              "varis_yeri"
            ],
            ""
          )
        ).trim().toLowerCase();


      const rowOrigin =
        String(
          getValue(
            row,
            [
              "origin",
              "from",
              "nereden",
              "yukleme_yeri",
              "cikis_yeri"
            ],
            ""
          )
        ).trim().toLowerCase();


      const rowVehicle =
        String(
          getValue(
            row,
            [
              "vehicle_type",
              "vehicle",
              "arac_tipi"
            ],
            ""
          )
        ).trim().toLowerCase();


      const rowDate =
        String(
          getValue(
            row,
            [
              "loading_date",
              "load_date",
              "date",
              "yukleme_tarihi"
            ],
            ""
          )
        ).slice(0,10);


      const okOrigin =
        !city ||
        rowOrigin.includes(city);


      const okDest =
        !dest ||
        rowDest.includes(dest);


      const okVehicle =
        !vehicle ||
        vehicle === "13.60 tır" ||
        rowVehicle.includes(
          vehicle.replace(" tır","")
        );


      const okDate =
        !date ||
        !rowDate ||
        rowDate === date;


      return (
        okOrigin &&
        okDest &&
        okVehicle &&
        okDate
      );

    });


  renderLoads(filtered);

  showToast(
    filtered.length +
    " uygun yük bulundu"
  );

}


function showToast(t) {

  const x =
    document.getElementById("toast");

  x.textContent = t;

  x.style.display = "block";


  setTimeout(() => {

    x.style.display = "none";

  },2200);

}


loadLoads();

</script>

</body>
</html>
